name: 编译 winlator-glibc

on:
  workflow_dispatch:  # 手动触发

jobs:
  build:
    runs-on: ubuntu-24.04-arm  # 使用 ARM 架构的 Ubuntu 24.04 运行器

    steps:
      # 对应 Job 1：安装系统依赖和 Docker
      - name: 安装系统依赖和 Docker
        run: |
          sudo apt update
          sudo apt upgrade -y
          sudo apt install -y git ca-certificates curl
          # 安装 Docker（官方脚本）
          curl -fsSL https://get.docker.com -o get-docker.sh
          sudo sh get-docker.sh
          docker --version

      # 对应 Job 2：创建并初始化 Docker 容器
      - name: 创建并启动 Docker 容器
        run: |
          # 后台运行容器
          sudo docker run -d --privileged --name winlator-rootfs ubuntu:24.04 sleep infinity
          sleep 5
          # 移除 i386 架构，然后更新并安装 git
          sudo docker exec winlator-rootfs bash -c "dpkg --remove-architecture i386 && apt update && apt upgrade -y && apt install -y git"

      # 对应 Job 3：克隆仓库并运行配置脚本
      - name: 克隆仓库
        run: |
          sudo docker exec winlator-rootfs bash -c "cd /root && git clone https://github.com/termux-pacman/glibc-packages.git"

      - name: 运行配置脚本
        run: |
          sudo docker exec winlator-rootfs bash -c "cd /root/glibc-packages && ./get-build-package.sh"
          sudo docker exec winlator-rootfs bash -c "cd /root/glibc-packages && ./scripts/setup-ubuntu.sh"
          sudo docker exec winlator-rootfs bash -c "cd /root/glibc-packages && ./scripts/setup-android-sdk.sh"
          sudo docker exec winlator-rootfs bash -c "cd /root/glibc-packages && ./scripts/setup-cgct.sh"

      # 对应 Job 4：编译、打包并上传产物
      - name: 编译 glibc 包
        run: |
          sudo docker exec winlator-rootfs bash -c "cd /root/glibc-packages && export TERMUX_PREFIX=/data/data/com.winlator/files/imagefs/usr && export TERMUX_PACKAGE_LIBRARY=glibc && ./build-package.sh -a aarch64 glibc"

      - name: 打包编译产物
        run: |
          # 清理并创建解包目录
          sudo docker exec winlator-rootfs bash -c "rm -rf /root/chanwu && mkdir -p /root/chanwu"
          # 循环解包所有 deb 文件
          sudo docker exec winlator-rootfs bash -c "for deb in /root/glibc-packages/output/*.deb; do dpkg-deb -x \"\$deb\" /root/chanwu; done"
          # 打包 data 目录
          sudo docker exec winlator-rootfs bash -c "cd /root/chanwu && tar czvf /root/winlator-glibc.tar.gz data"
          # 将 tar 包复制到主机
          sudo docker cp winlator-rootfs:/root/winlator-glibc.tar.gz ./winlator-glibc.tar.gz

      - name: 上传产物到 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: winlator-glibc
          path: ./winlator-glibc.tar.gz
